[pytest]
testpaths = tests
norecursedirs = .git .venv .worktrees node_modules data profiles logs
addopts = --timeout=60 --timeout-method=thread
markers =
    local_cdp: launches a visible local stable Chrome CDP fixture (set CREATORHUB_RUN_LOCAL_CDP=1)
    slow: long-running integration tests; deselect with -m "not slow"
timeout = 60
timeout_method = thread
